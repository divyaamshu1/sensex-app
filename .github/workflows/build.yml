name: Build Sensex APK

on:
  push:
    branches: [main]
  workflow_dispatch:   # trigger manually from GitHub UI on phone

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # JOB 1 — Build Go backend binaries for all targets
  # ──────────────────────────────────────────────────────────────────────────
  build-backend:
    name: Go Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true
          cache-dependency-path: backend/go.mod

      - name: Verify backend compiles
        working-directory: backend
        run: go build ./...

      - name: Build Linux amd64
        working-directory: backend
        run: |
          mkdir -p ../dist
          GOOS=linux GOARCH=amd64 \
            go build -ldflags="-s -w" \
            -o ../dist/sensex-server-linux-amd64 \
            ./cmd/server

      - name: Build Android ARM64  (modern phones)
        working-directory: backend
        run: |
          CGO_ENABLED=0 GOOS=android GOARCH=arm64 \
            go build -ldflags="-s -w" \
            -o ../dist/sensex-server-android-arm64 \
            ./cmd/server

      - name: Upload backend binaries
        uses: actions/upload-artifact@v4
        with:
          name: backend-binaries
          path: dist/
          retention-days: 30

  # ──────────────────────────────────────────────────────────────────────────
  # JOB 2 — Build React → Capacitor → Android APK (with embedded Go binary)
  # ──────────────────────────────────────────────────────────────────────────
  build-apk:
    name: Android APK
    runs-on: ubuntu-latest
    needs: build-backend   # wait for Go binaries

    steps:
      - uses: actions/checkout@v4

      # ── Download Go binary from job 1 ─────────────────────────────────
      - name: Download backend binaries
        uses: actions/download-artifact@v4
        with:
          name: backend-binaries
          path: dist/

      # ── Node & React build ─────────────────────────────────────────────
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Build React app
        working-directory: frontend
        run: npm run build
        env:
          REACT_APP_API_URL: http://localhost:8080
          CI: false

      # ── Capacitor: init Android platform ──────────────────────────────
      - name: Capacitor sync
        working-directory: frontend
        run: npx cap sync android 2>/dev/null || true

      - name: Init Capacitor android platform if missing
        working-directory: frontend
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
            npx cap sync android
          fi

      # ── EMBED Go binary into APK assets (THE KEY AUTOMATION STEP) ─────
      # BackendService.java extracts this at app startup — no Termux needed
      - name: Embed Go binary into APK assets
        run: |
          mkdir -p frontend/android/app/src/main/assets
          cp dist/sensex-server-android-arm64 \
             frontend/android/app/src/main/assets/sensex-server
          echo "Binary size: $(du -sh dist/sensex-server-android-arm64 | cut -f1)"

      # ── Copy our Java sources into the Capacitor Android project ──────
      - name: Copy BackendService + MainActivity
        run: |
          JAVA_DIR=frontend/android/app/src/main/java/com/sensexlive/app
          mkdir -p "$JAVA_DIR"
          cp android/app/src/main/java/com/sensexlive/app/BackendService.java "$JAVA_DIR/"
          cp android/app/src/main/java/com/sensexlive/app/MainActivity.java   "$JAVA_DIR/"

      # ── Copy AndroidManifest + res overrides ──────────────────────────
      - name: Copy AndroidManifest and resources
        run: |
          cp android/app/src/main/AndroidManifest.xml \
             frontend/android/app/src/main/AndroidManifest.xml

          mkdir -p frontend/android/app/src/main/res/xml
          cp android/app/src/main/res/xml/network_security_config.xml \
             frontend/android/app/src/main/res/xml/network_security_config.xml

          mkdir -p frontend/android/app/src/main/res/values
          cp android/app/src/main/res/values/strings.xml \
             frontend/android/app/src/main/res/values/strings.xml
          cp android/app/src/main/res/values/colors.xml \
             frontend/android/app/src/main/res/values/colors.xml
          cp android/app/src/main/res/values/styles.xml \
             frontend/android/app/src/main/res/values/styles.xml

      # ── Patch build.gradle: disable compression on Go binary ──────────
      - name: Patch build.gradle noCompress
        working-directory: frontend/android
        run: |
          if ! grep -q "noCompress" app/build.gradle; then
            sed -i '/defaultConfig {/a\        aaptOptions { noCompress("sensex-server") }' app/build.gradle
          fi

      # ── Gradle + Java + Android SDK ────────────────────────────────────
      - name: Make gradlew executable
        working-directory: frontend/android
        run: chmod +x gradlew

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      # ── Build debug APK ────────────────────────────────────────────────
      - name: Build debug APK
        working-directory: frontend/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}

      # ── Upload APK ─────────────────────────────────────────────────────
      - name: Rename APK
        run: |
          mkdir -p apk-out
          cp frontend/android/app/build/outputs/apk/debug/app-debug.apk \
             apk-out/SensexLive-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SensexLive-APK
          path: apk-out/SensexLive-debug.apk
          retention-days: 30

      - name: Upload android project (for signing later)
        uses: actions/upload-artifact@v4
        with:
          name: android-project
          path: frontend/android/
          retention-days: 7
